<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EPA Superfund Sites Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }
        .legend {
            line-height: 40px;
            font-size: 16px;
            width: 190px;
            color: #333333;
            padding: 6px 8px;
            background: rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            font-family: 'Titillium Web', sans-serif;
        }
        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
</head>
<body>
    <div id="map"></div>
    <script>
        // Map
        var mymap = L.map('map', {
            center: [39.8283, -98.5795],  
            zoom: 5,
            maxZoom: 20,
            minZoom: 5,
            detectRetina: true
        });
        L.tileLayer('http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(mymap);

  
        var markerColors = chroma.scale('Set3').colors(10);

       
        for (var i = 0; i < markerColors.length; i++) {
            $('head').append($("<style> .marker-color-" + (i + 1) +
                " { color: " + markerColors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff; } </style>"));
        }


        var statusMapping = {
            "NOT ON THE NPL": 0,
            "SITE IS PART OF NPL SITE": 1,
            "CURRENTLY ON THE FINAL NPL": 2,
            "Other": 9
        };

        // Superfund sites with popup
        var superfund_sites = L.geoJson.ajax("assets/Superfund_Sites.geojson", {

            onEachFeature: function(feature, layer) {
                layer.bindTooltip("<h3> Name </h3> " + 
        feature.properties['PRIMARY_NAME'] + "</h3> <p>"
          +
          "<h4> Address </h2> " +
        feature.properties['LOCATION_ADDRESS'] + "</h3> <p>"
           +
           "<h4> County </h2> " +
        feature.properties['COUNTY_NAME'] + "</h3> <p>"
           +
           "<h4> City </h2> " +
        feature.properties['CITY_NAME'] + "</h3> <p>"
           +
           "<h4> State </h2> " +
        feature.properties['STATE_CODE'] + "</h3> <p>"
           +
           "<h4> Zip </h2> " +
        feature.properties['POSTAL_CODE'] + "</h3> <p>"
           +
           "<h4> url </h2> " +
        feature.properties['FAC_URL'] + "</h3> <p>"        
      )


        
            },


            pointToLayer: function(feature, latlng) {
                var status = feature.properties.ACTIVE_STATUS;
                var idx = (statusMapping[status] !== undefined) ? statusMapping[status] : 9;
                return L.marker(latlng, {
                    icon: L.divIcon({
                        className: 'fa fa-flask marker-color-' + (idx + 1),
                        html: ''
                    })
                });
            },


            attribution: 'EPA Superfund Sites | Base Map; CartoDB | Map Author: Edgar Castillo-Ramos'
        }).addTo(mymap);

        // Set region colors
        function getRegionColor(regionNumber) {
            switch (regionNumber) {
                case 1: return '#8dd3c7';
                case 2: return '#ffffb3';
                case 3: return '#bebada';
                case 4: return '#fb8072';
                case 5: return '#80b1d3';
                case 6: return '#fdb462';
                case 7: return '#fccde5';
                case 8: return '#bc80bd';
                default: return '#ccc';
            }
        }

     
        function regionStyle(feature) {
            return {
                fillColor: getRegionColor(feature.properties.EPAREGION),
                fillOpacity: 0.4,
                weight: 2,
                opacity: 1,
                color: '#b4b4b4',
                dashArray: '4'
            };
        }

     
        L.geoJson.ajax("assets/EPA_Regions.geojson", {
            style: regionStyle,
            onEachFeature: function(feature, layer) {
                if (feature.properties && feature.properties.EPAREGION) {
                    layer.bindPopup("EPA Region " + feature.properties.EPAREGION);
                }
            },
        }).addTo(mymap);


        // Legend 
        var regionColors = {
    1: '#8dd3c7',
    2: '#ffffb3',
    3: '#bebada',
    4: '#fb8072',
    5: '#80b1d3',
    6: '#fdb462',
    7: '#fccde5',
    8: '#bc80bd'
};


var statusMapping = {
    "NOT ON THE NPL": 0,
    "SITE IS PART OF NPL SITE": 1,
    "CURRENTLY ON THE FINAL NPL": 2,
    
};

        var legend = L.control({position: 'topright'});

legend.onAdd = function () {
    var div = L.DomUtil.create('div', 'legend');
    
    // ----- EPA Regions Legend (Polygon Shading) -----
    div.innerHTML += '<b>EPA Regions</b><br />';
    // Loop through regions 1 to 8.
    for (var i = 1; i <= 8; i++) {
        div.innerHTML +=
            '<i style="background: ' + regionColors[i] + '; opacity: 0.5"></i>' +
            '<p>Region ' + i + '</p>';
    }
    
    div.innerHTML += '<hr>';
    
    div.innerHTML += '<b>EPA Superfund Site Status</b><br />';
    div.innerHTML += '<i class="fa fa-flask marker-color-' + (statusMapping["NOT ON THE NPL"]+1) +
                     '"></i><p>Not on the NPL</p>';
    div.innerHTML += '<i class="fa fa-flask marker-color-' + (statusMapping["SITE IS PART OF NPL SITE"]+1) +
                     '"></i><p>Part of NPL site</p>';
    div.innerHTML += '<i class="fa fa-flask marker-color-' + (statusMapping["CURRENTLY ON THE FINAL NPL"]+1) +
                     '"></i><p>Currently on the Final NPL</p>';
    return div;
};

legend.addTo(mymap);

        // Scale
        L.control.scale({position: 'bottomleft'}).addTo(mymap);
    </script>
</body>
</html>
